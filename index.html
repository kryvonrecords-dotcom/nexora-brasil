<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nexora Brasil</title>
    <meta name="description" content="Nexora Brasil - Jornalismo independente com notícias do Brasil, Economia, Tecnologia, Mundo e Desporto 24 horas por dia." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Nexora Brasil" />
    <meta name="apple-mobile-web-app-title" content="Nexora Brasil" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#00843D" />
    <meta name="msapplication-TileColor" content="#071526" />
    <meta name="msapplication-navbutton-color" content="#00843D" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.svg" />

    <meta property="og:title" content="Nexora Brasil" />
    <meta property="og:description" content="Notícias do Brasil e do Mundo com apuração rigorosa, análise económica e atualizações em tempo real." />
    <meta property="og:type" content="news" />
    <meta property="og:image" content="/icon-512.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512.svg" />
    
    <!-- Google Fonts for Modern Editorial Journalism -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased font-sans select-none sm:select-auto">
    <div id="root">
      <div id="app-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #071526; color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid rgba(0, 132, 61, 0.25); border-top-color: #00843D; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 700; color: #E2E8F0; letter-spacing: 0.5px;">A carregar Nexora Brasil...</p>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      // Clean up legacy service worker caches if present
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key === 'nexora-news-v1' || key === 'nexora-news-v2') {
              caches.delete(key);
            }
          });
        }).catch(() => {});
      }

      // Register PWA Service Worker safely
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              if (reg.update) reg.update();
            })
            .catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
